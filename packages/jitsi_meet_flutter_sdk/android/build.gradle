group 'org.jitsi.jitsi_meet_flutter_sdk'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Consort: the Jitsi Meet SDK and its React Native modules come from our
// build of the vendored source, not from Jitsi's Maven repository.
// See third_party/jitsi-meet/README.consort.md.
def jitsiSdkMaven = new File(rootProject.projectDir, '../third_party/jitsi-sdk-maven')
if (!jitsiSdkMaven.isDirectory()) {
    throw new GradleException("Missing ${jitsiSdkMaven}. Run tools/build-jitsi-sdk first.")
}

rootProject.allprojects {
    repositories {
        maven { url jitsiSdkMaven.toURI() }
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'org.jitsi.jitsi_meet_flutter_sdk'
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
 
    packagingOptions {
        pickFirst 'androidx/media3/exoplayer/rtsp/RtspMediaSource.class'
        pickFirst 'androidx/media3/exoplayer/rtsp/RtspMediaSource$Factory.class'
    }
}

configurations.all {
    exclude group: 'androidx.media3', module: 'media3-exoplayer-rtsp'
}
 
dependencies {
    implementation ("org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version")
    // Consort: keep in sync with sdk_version in tools/build-jitsi-sdk.
    implementation ("org.jitsi.react:jitsi-meet-sdk:13.1.1-consort") {
        transitive = true
    }
}
