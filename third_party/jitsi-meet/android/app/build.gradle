// Consort: a stand-in for the Jitsi Meet app, which isn't vendored.
//
// Several React Native modules' builds look for an application project
// in the build, for its build directory, as upstream's build includes the app.
// This provides one, with none of the app's code or its Google services.
apply plugin: 'com.android.application'

android {
    namespace 'org.jitsi.meet.standin'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }

    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }
}
